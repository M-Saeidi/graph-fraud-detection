  <text x="44" y="42" fill="#087d72" font-family="Aptos, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EXPLORATORY EVALUATION · LOCAL COPY</text>
  <text x="44" y="77" fill="#172622" font-family="Aptos Display, Aptos, Segoe UI, sans-serif" font-size="25" font-weight="650">Source amount captured by feature stage</text>
  <text x="44" y="104" fill="#64746e" font-family="Aptos, Segoe UI, sans-serif" font-size="13">Same chronological test set · identical model settings · training-only negative sampling</text>

