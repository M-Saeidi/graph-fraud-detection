<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Source amount captured by feature stage and review capacity</title>
  <desc id="chart-desc">Grouped horizontal bars compare A0, A plus B, and A plus B plus C for the top 0.1, 0.5, and 1 percent review queues. All panels use a shared scale from zero to 200,000 source amount units.</desc>
