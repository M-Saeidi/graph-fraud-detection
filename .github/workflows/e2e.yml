name: Fresh Browser and Backend Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fraud-ui/package-lock.json

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run backend tests
        run: python -m pytest -q -W error -c pytest.ini

      - name: Install frontend dependencies
        run: npm ci
        working-directory: fraud-ui

      - name: Build frontend
        run: npm run build
        working-directory: fraud-ui

      - name: Lint frontend
        run: npm run lint
        working-directory: fraud-ui

      - name: Audit frontend dependencies
        run: npm audit --omit=dev
        working-directory: fraud-ui

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: fraud-ui

      - name: Run browser tests
        run: npm run test:e2e
        working-directory: fraud-ui
